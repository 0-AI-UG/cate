name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    # Without this, a hung step (e.g. a test leaving a child process that holds
    # the step's stdout pipe open) runs until GitHub's 6-hour default. Bound it
    # so CI fails fast and surfaces the culprit instead of hanging for hours.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install setuptools (needed by node-gyp)
        run: pip install setuptools

      # npm ci honors the committed package-lock.json so PR runs are
      # deterministic, so a fresh upstream release cannot break an unrelated
      # PR. It fails loudly if package.json and the
      # lockfile drift out of sync; regenerate with `npm install` locally.
      - name: Install dependencies
        run: npm ci

      # Build the same native addon shipped in Linux runtime tarballs and inspect
      # its ELF symbol versions. This catches a future image/toolchain change
      # that would make terminals fail on glibc 2.28–2.31 hosts (#604).
      - name: Linux runtime glibc compatibility regression
        if: runner.os == 'Linux'
        run: npm run test:runtime:linux-glibc

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # E2E and Electron smoke tests run locally only. Keep the npm scripts
      # available for browser, T3, SSH loopback, and full-app validation.
