name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    # Without this, a hung step (e.g. a test leaving a child process that holds
    # the step's stdout pipe open) runs until GitHub's 6-hour default. Bound it
    # so CI fails fast and surfaces the culprit instead of hanging for hours.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install setuptools (needed by node-gyp)
        run: pip install setuptools

      # npm ci honors the committed package-lock.json so PR runs are
      # deterministic, so a fresh upstream release cannot break an unrelated
      # PR. It fails loudly if package.json and the
      # lockfile drift out of sync; regenerate with `npm install` locally.
      - name: Install dependencies
        run: npm ci

      # Build the same native addon shipped in Linux runtime tarballs and inspect
      # its ELF symbol versions. This catches a future image/toolchain change
      # that would make terminals fail on glibc 2.28–2.31 hosts (#604).
      - name: Linux runtime glibc compatibility regression
        if: runner.os == 'Linux'
        run: npm run test:runtime:linux-glibc

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Layering rules
        run: npm run lint:deps

      - name: Unit tests
        run: npm run test

      # E2E and Electron smoke tests run locally only. Keep the npm scripts
      # available for browser, T3, and full-app validation.

  # The release builds a runtime tarball per target; build the Linux one here
  # so a broken staging step (CLI, T3, natives, BUILD, checksum) fails the PR
  # instead of the release.
  runtime-tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install setuptools (needed by node-gyp)
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci

      - name: Build runtime tarball (linux-x64)
        run: node scripts/build-runtime-tarball.mjs --target linux-x64 --docker

      - name: Check the tarball installs
        run: |
          tgz=$(ls dist-runtime/cate-runtime-*-linux-x64.tgz)
          (cd dist-runtime && sha256sum -c "$(basename "$tgz").sha256")
          mkdir -p /tmp/rt && tar -xzf "$tgz" -C /tmp/rt
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?\+[0-9a-f]{12}$' /tmp/rt/BUILD
          /tmp/rt/runtime/bin/node /tmp/rt/cate/dist/cli.cjs --help > /dev/null
