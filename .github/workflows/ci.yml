name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    # Without this, a hung step (e.g. a test leaving a child process that holds
    # the step's stdout pipe open) runs until GitHub's 6-hour default. Bound it
    # so CI fails fast and surfaces the culprit instead of hanging for hours.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install setuptools (needed by node-gyp)
        run: pip install setuptools

      # npm ci honors the committed package-lock.json so PR runs are
      # deterministic, so a fresh upstream release cannot break an unrelated
      # PR. It fails loudly if package.json and the
      # lockfile drift out of sync; regenerate with `npm install` locally.
      - name: Install dependencies
        run: npm ci

      # Build the same native addon shipped in Linux runtime tarballs and inspect
      # its ELF symbol versions. This catches a future image/toolchain change
      # that would make terminals fail on glibc 2.28–2.31 hosts (#604).
      - name: Linux runtime glibc compatibility regression
        if: runner.os == 'Linux'
        run: npm run test:runtime:linux-glibc

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Typecheck
        run: npm run typecheck

      # The extensions catalog is its own repo (0-AI-UG/cate-extensions). Check
      # it out + build so the catalog/distribution and kitchensink-server tests
      # run against the real artifact instead of skipping. Skipped on Windows:
      # the catalog repo's bash build.sh isn't Git-Bash/MSYS safe, and those
      # tests skipIf the catalog is absent, so Windows stays green.
      - name: Check out extensions catalog
        if: runner.os != 'Windows'
        uses: actions/checkout@v7
        with:
          repository: 0-AI-UG/cate-extensions
          path: cate-extensions

      - name: Build extensions catalog
        if: runner.os != 'Windows'
        run: ./build.sh
        shell: bash
        working-directory: cate-extensions

      - name: Unit tests
        run: npm run test

      - name: Install OpenSSH server for loopback E2E
        if: runner.os == 'Linux'
        run: |
          if ! command -v sshd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y openssh-server
          fi
          sudo mkdir -p /run/sshd

      - name: System OpenSSH loopback E2E
        if: runner.os != 'Windows'
        run: npm run test:ssh:loopback

      - name: Electron smoke test (macOS only)
        if: matrix.os == 'macos-latest'
        run: npm run test:smoke:electron

      # Browser-control E2E does not need the separately packaged Cate runtime:
      # it drives local deterministic HTTP fixtures through the real Electron
      # webview + CDP boundary. Keep this cross-platform so Chromium/Electron
      # behavior changes cannot pass on one desktop OS and fail silently on the
      # others. Linux needs a virtual display even though Cate hides its window.
      - name: Browser workflow E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e:browser
        env:
          E2E_SKIP_PERF: "1"

      - name: Browser workflow E2E (macOS/Windows)
        if: runner.os != 'Linux'
        run: npm run test:e2e:browser
        env:
          E2E_SKIP_PERF: "1"

      - name: Browser workflow flake check (macOS)
        if: runner.os == 'macOS'
        run: npx playwright test e2e/browser-advanced-workflows.spec.ts --repeat-each=3
        env:
          E2E_SKIP_PERF: "1"

      # T3 uses the real bundled server and an isolated deterministic provider
      # CLI. Provision the host runtime tarball just as packaged Cate does.
      - name: Build runtime tarball for T3 integration tests (macOS)
        if: runner.os == 'macOS'
        run: npm run runtime:tarball

      - name: T3 integration E2E (macOS)
        if: runner.os == 'macOS'
        run: npm run test:e2e:agent

      # The remaining Playwright specs stay outside this gate: broader runtime,
      # drag, and performance scenarios have separate infrastructure/timing needs.
      # T3 pays the runtime-build cost on macOS; browser E2E stays cross-platform.
