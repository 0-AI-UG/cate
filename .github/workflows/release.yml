name: Release

# Run manually (Actions > Release > Run workflow) on the commit to ship. The tag
# is derived from package.json and is NOT pushed up front: the release stays a
# tag-less draft until every platform has uploaded, and publishing it (last
# step) creates the tag. Pushing the tag first made the public releases.atom
# feed advertise the version while its latest-*.yml files were still missing,
# so running apps hit a 404 during the build window.
on:
  workflow_dispatch:

permissions:
  contents: write

# Release runtime bundles prune unused installs (scripts/build-runtime.mjs).
env:
  CATE_RELEASE: '1'

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag from package.json
        id: meta
        run: |
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (skip if exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # A tag with a semver pre-release suffix (a hyphen, e.g. v1.2.0-beta.1)
          # is published as a GitHub pre-release. GitHub excludes pre-releases
          # from the "Latest" badge and the /releases/latest API the website
          # uses, so stable users and the public download are unaffected — only
          # users who opted into beta builds in-app (autoUpdater.allowPrerelease)
          # are offered it. The later "Publish release" step un-drafts without
          # touching the pre-release flag, so it stays a pre-release.
          PRERELEASE_FLAG=""
          case "$TAG" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists; bump the version in package.json" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Draft release $TAG already exists, reusing it"
          else
            # --target pins the tag that publishing will create to this commit.
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --target "${{ github.sha }}" --draft --generate-notes $PRERELEASE_FLAG
          fi

  release:
    # The installers ship the runtime tarballs the `runtime` job published to
    # this release (the same bytes a remote install downloads), so the app
    # waits for them. linux-arm64 has no installer and builds on its own.
    needs: [create-release, runtime]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install setuptools (needed by node-gyp)
        run: pip install setuptools

      # npm ci honors the committed package-lock.json so releases are built
      # from pinned dependency versions, not whatever upstream published that
      # day. Regenerate the lockfile with `npm install` locally to upgrade.
      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run icons

      # Regenerate the embedded runtime version string from package.json before
      # building the app. A release whose version bump only touched
      # package.json (e.g. a beta tag) otherwise leaves the committed
      # version.ts stale, and the app looks for the wrong tarball name.
      - name: Sync runtime version to package.json
        run: npm run build:runtime

      - name: Build app
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Import the Developer ID cert into a scoped keychain and export
      # CSC_KEYCHAIN, which the macOS packaging step signs with.
      - name: Set up macOS signing
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: bash scripts/ci-mac-signing-keychain.sh

      # The local workspace runs the runtime daemon tarball shipped inside the
      # installer (electron-builder.yml extraResources). Linux and Windows ship
      # one, runtime-host.tgz. A single macOS .app runs on either CPU and the
      # daemon's bundled node + node-pty are arch-specific (an arm64 daemon
      # cannot exec on an Intel Mac, #384), so it ships both,
      # runtime-host-<arch>.tgz, and picks one at runtime
      # (src/shells/desktop/main/updater/runtimeInstall.ts).
      - name: Stage runtime tarballs from the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.create-release.outputs.tag }}
        run: |
          mkdir -p dist-runtime
          stage() {
            gh release download "$TAG_NAME" --repo "${{ github.repository }}" \
              --pattern "cate-runtime-*-$1.tgz" --dir dist-runtime --clobber
            cp dist-runtime/cate-runtime-*-"$1".tgz "dist-runtime/$2"
          }
          case "${{ matrix.platform }}" in
            mac)
              stage darwin-arm64 runtime-host-arm64.tgz
              stage darwin-x64 runtime-host-x64.tgz ;;
            linux) stage linux-x64 runtime-host.tgz ;;
            win) stage win32-x64 runtime-host.tgz ;;
          esac

      - name: Stage both macOS @parcel/watcher arches
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          VER=$(node -p "require('@parcel/watcher/package.json').version")
          for arch in darwin-x64 darwin-arm64; do
            dest="node_modules/@parcel/watcher-$arch"
            [ -f "$dest/watcher.node" ] && continue
            tmp=$(mktemp -d)
            ( cd "$tmp" && npm pack "@parcel/watcher-$arch@$VER" --silent )
            mkdir -p "$dest"
            tar -xzf "$tmp"/*.tgz -C "$tmp"
            cp -R "$tmp"/package/* "$dest"/
            rm -rf "$tmp"
          done

      # E2E tests run locally only and do not gate release packaging.

      - name: Package (macOS)
        if: matrix.platform == 'mac'
        # Raise the file-descriptor limit: codesign walks every unpacked file
        # under app.asar.unpacked, and the macOS runner's default soft limit
        # (256) is exhausted now that the full node_modules tree is unpacked,
        # surfacing as `EMFILE: too many open files` during signing.
        # Reuse CSC_KEYCHAIN from the signing setup above. Passing
        # CSC_LINK here makes electron-builder create a second keychain and use
        # the certificate password where macOS expects the keychain password.
        run: ulimit -n 65536 && npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Set only after Apple grants the browser passkey capability and Paul
          # creates a Developer ID provisioning profile for com.cate.app.
          CATE_PASSKEYS_PROFILE_BASE64: ${{ secrets.CATE_PASSKEYS_PROFILE_BASE64 }}

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package (Windows)
        if: matrix.platform == 'win'
        # Code signing: set the WINDOWS_CERTS (base64 of the .pfx) +
        # WINDOWS_CERTS_PASSWORD repo secrets and electron-builder signs the
        # installer + exe automatically (removes the SmartScreen "unknown
        # publisher" warning). When the secrets are absent the build still
        # succeeds — it just produces an unsigned artifact, so this is safe to
        # land before the certificate is provisioned. (Microsoft's newer Azure
        # Trusted Signing is the alternative if an OV/EV .pfx isn't available.)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTS_PASSWORD }}

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.create-release.outputs.tag }}
        run: |
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find release -maxdepth 1 -type f \
            ! -name 'builder-debug.yml' \
            ! -name 'builder-effective-config.yaml' \
            -print0)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No top-level release artifacts found in $(pwd)/release"
            exit 1
          fi

          gh release upload "$TAG_NAME" "${files[@]}" \
            --repo "${{ github.repository }}" \
            --clobber

  # Per-target cate-runtime daemon tarballs, each with its .sha256. macOS and
  # Windows build on matching runners; Linux uses the pinned old-glibc
  # container. Uploaded to the same release so an install can pull its tarball
  # straight from the release URL (src/runtime/daemon/node/install.ts,
  # scripts/install.sh), and the installers ship the same bytes.
  runtime:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            docker: true
          - os: macos-latest
            target: darwin-arm64
          # Intel macOS. node-pty's native binary can't be cross-built for x64
          # from an Apple Silicon host (build-runtime-tarball.mjs refuses), so
          # this must run on an Intel runner. macos-15-intel is GitHub's last
          # hosted Intel image, available until Aug 2027; after that this needs
          # a self-hosted Intel runner or Intel support has to be dropped.
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-latest
            target: win32-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install setuptools (needed by node-gyp)
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci

      # Stage node-pty from build/Release. macOS/Windows installs use a shipped
      # prebuild (build/Release empty) so compile from source. Linux is
      # compiled in the pinned old-glibc container; the host build produced by
      # npm ci is deliberately ignored.
      # The windows runner image ships Visual Studio 2026 (18.x), which node-gyp
      # only learned to detect in 12.1.0, hence the node-gyp override in
      # package.json. Without it this step fails with "could not find any Visual
      # Studio installation to use".
      - name: Compile node-pty from source (mac/win; Linux builds it in Docker)
        if: runner.os != 'Linux'
        run: npm rebuild node-pty --build-from-source

      # Sign the bundled darwin natives so the tarball notarizes inside the app
      # and a mac host that pulls it from the release runs Developer
      # ID-signed binaries (no Gatekeeper quarantine block).
      - name: Set up macOS signing for runtime natives
        if: startsWith(matrix.target, 'darwin-')
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: bash scripts/ci-mac-signing-keychain.sh

      - name: Build runtime tarball (${{ matrix.target }})
        run: node scripts/build-runtime-tarball.mjs --target ${{ matrix.target }} ${{ matrix.docker && '--docker' || '' }}

      - name: Upload runtime tarball
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.create-release.outputs.tag }}
        run: |
          gh release upload "$TAG_NAME" dist-runtime/cate-runtime-*-${{ matrix.target }}.tgz \
            dist-runtime/cate-runtime-*-${{ matrix.target }}.tgz.sha256 \
            --repo "${{ github.repository }}" \
            --clobber

  # Linux arm64 runs under QEMU and is slow; no installer needs it, so it
  # builds beside the app jobs instead of before them.
  runtime-linux-arm64:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install setuptools (needed by node-gyp)
        run: pip install setuptools

      - uses: docker/setup-qemu-action@v4

      - name: Install dependencies
        run: npm ci

      - name: Build runtime tarball (linux-arm64)
        run: node scripts/build-runtime-tarball.mjs --target linux-arm64 --docker

      - name: Upload runtime tarball
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.create-release.outputs.tag }}
        run: |
          gh release upload "$TAG_NAME" dist-runtime/cate-runtime-*-linux-arm64.tgz \
            dist-runtime/cate-runtime-*-linux-arm64.tgz.sha256 \
            --repo "${{ github.repository }}" \
            --clobber

  publish-release:
    needs: [create-release, release, runtime, runtime-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `curl -fsSL <release>/install.sh | sh` installs the runtime on a
      # machine without the desktop app (cate serve).
      - name: Upload runtime install script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" scripts/install.sh \
            --repo "${{ github.repository }}" \
            --clobber

      # Un-drafting is what creates the tag (at the --target commit above).
      - name: Publish release (remove draft, creates tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.create-release.outputs.tag }}" --repo "${{ github.repository }}" --draft=false
